<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="shop.css">
    <title>Cửa hàng | AsmrProg</title>
</head>

<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <a href="#" class="logo">
            <i class='bx bx-code-alt'></i>
            <div class="logo-name"><span>Asmr</span>Prog</div>
        </a>
        <ul class="side-menu">
            <li><a href="dashboard.html"><i class='bx bxs-dashboard'></i>Bảng điều khiển</a></li>
            <li class="active"><a href="#"><i class='bx bx-store-alt'></i>Cửa hàng</a></li>
            <li><a href="analytics.html"><i class='bx bx-analyse'></i>Phân tích</a></li>
            <li><a href="tickets.html"><i class='bx bx-message-square-dots'></i>Vé hỗ trợ</a></li>
            <li><a href="users.html"><i class='bx bx-group'></i>Người dùng</a></li>
            <li><a href="settings.html"><i class='bx bx-cog'></i>Cài đặt</a></li>
        </ul>
        <ul class="side-menu">
            <li>
                <a href="#" class="logout">
                    <i class='bx bx-log-out-circle'></i>
                    Đăng xuất
                </a>
            </li>
        </ul>
    </div>
    <!-- End of Sidebar -->

    <!-- Main Content -->
    <div class="content">
        <!-- Navbar -->
        <nav>
            <i class='bx bx-menu'></i>
            <form action="#">
                <div class="form-input">
                    <input type="search" placeholder="Tìm kiếm sản phẩm...">
                    <button class="search-btn" type="submit"><i class='bx bx-search'></i></button>
                </div>
            </form>
            <input type="checkbox" id="theme-toggle" hidden>
            <label for="theme-toggle" class="theme-toggle"></label>
            <a href="#" class="notif">
                <i class='bx bx-bell'></i>
                <span class="count">5</span>
            </a>
            <a href="#" class="profile">
                <img src="images/logo.png">
            </a>
        </nav>
        <!-- End of Navbar -->

        <main>
            <div class="header">
                <div class="left">
                    <h1>Cửa hàng</h1>
                    <ul class="breadcrumb">
                        <li><a href="dashboard.html">Bảng điều khiển</a></li>
                        /
                        <li><a href="#" class="active">Cửa hàng</a></li>
                    </ul>
                </div>
            </div>

            <!-- Product Grid -->
            <div class="product-grid">
                <div class="product-card">
                    <img src="images/product-1.jpg" alt="Sản phẩm 1">
                    <h3>Sản phẩm 1</h3>
                    <p class="price">500.000 VND</p>
                    <button class="btn-buy">Mua ngay</button>
                </div>
                <div class="product-card">
                    <img src="images/product-2.jpg" alt="Sản phẩm 2">
                    <h3>Sản phẩm 2</h3>
                    <p class="price">750.000 VND</p>
                    <button class="btn-buy">Mua ngay</button>
                </div>
                <div class="product-card">
                    <img src="images/product-3.jpg" alt="Sản phẩm 3">
                    <h3>Sản phẩm 3</h3>
                    <p class="price">1.200.000 VND</p>
                    <button class="btn-buy">Mua ngay</button>
                </div>
                <!-- Thêm nhiều sản phẩm hơn nếu cần -->
            </div>
            <!-- End of Product Grid -->

        </main>

    </div>

    <script src="shop.js"></script>
</body>

</html>
