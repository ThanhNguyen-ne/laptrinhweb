<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../assets/css/dangnhap.css" />
    <script src="../assets/js/dangnhap.js"></script>
    <title>Đăng nhập</title>
</head>
<body>
    <div align="center" id="id01">
        <div class="form-container">
            <form class="form">
                <p class="title">Đăng nhập</p>

                <div class="toggle-btn-container">
                    <button type="button" class="toggle-btn active" id="emailToggle" onclick="showEmailLogin()">Email</button>
                    <button type="button" class="toggle-btn" id="phoneToggle" onclick="showPhoneLogin()">Số điện thoại</button>
                </div>

                <div id="emailLoginForm">
                    <input id="loginEmail" placeholder="Email" type="email" class="input" />
                </div>

                <div id="phoneLoginForm" style="display: none;">
                    <input id="loginPhone" placeholder="Số Điện Thoại" type="text" class="input" />
                </div>

                <input id="loginPassword" placeholder="Mật khẩu" type="password" class="input" />
                <div id="loginMessage" class="error-message"></div>
                
                <p class="page-link">
                    <span class="page-link-label">Quên mật khẩu?</span>
                </p>
                <button class="form-btn" onclick="login(event)">Đăng nhập</button>
            </form>
            <p class="sign-up-label">
                Chưa có tài khoản?<span class="sign-up-link"><a href="javascript:switchToSignup()"> Đăng kí</a> </span>
            </p>
        </div>
    </div>
</body>
</html>
